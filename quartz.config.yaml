            "curriculo-cv": "Currículo CV"
          };

          if (titleMap[seg]) {
            node.displayName = titleMap[seg];
            return node;
          }

          const m = seg.match(/^(\d+)-periodo$/);
          if (m) {
            node.displayName = `${m[1]}º Período`;
            return node;
          }

          if (node.isFolder || !node.data?.frontmatter?.title) {
            const romans = { "i": "I", "ii": "II", "iii": "III", "iv": "IV", "v": "V", "vi": "VI", "vii": "VII", "viii": "VIII", "ix": "IX", "x": "X" };
            const lowerWords = new Set(["de", "da", "do", "das", "dos", "e", "em", "para", "com", "a", "o", "as", "os"]);
            const parts = seg.split("-").map((w, idx) => {
              if (romans[w]) return romans[w];
              if (idx > 0 && lowerWords.has(w)) return w;
              return w.charAt(0).toUpperCase() + w.slice(1);
            });
            node.displayName = parts.join(" ");
          }
          return node;
        }
