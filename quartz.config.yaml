            "pesquisa-operacional-ii": "Pesquisa Operacional II",
            "sociedade-e-tecnologia": "Sociedade e Tecnologia",
            "computacao-sociedade-e-inclusao": "Computação, Sociedade e Inclusão",
            "libras": "LIBRAS",
