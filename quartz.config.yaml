# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Pedro H. R. de Andrade"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: pt-BR
  baseUrl: www.phrandrade.com
  ignorePatterns:
    - private
    - templates
    - templates/**
    - "**/templates/**"
    - .obsidian
    - "**/*.sync-conflict-*"
    - "**/_materiais"
    - "**/_materiais/**"
    - "**/Esboço"
    - "**/Esboço/**"
    - "**/esboço"
    - "**/esboço/**"
    - "**/Esboco"
    - "**/Esboco/**"
    - "**/esboco"
    - "**/esboco/**"
    - "**/README*"
    - "**/*README*"
    - "**/README - *"
    - "CLAUDE.md"
    - "**/CLAUDE.md"
    - "content/resource/**/*.md"
    - "**/resource/**/*.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8ff"
        lightgray: "#f3eefc"
        gray: "#8b7ca8"
        darkgray: "#241836"
        dark: "#120924"
        secondary: "#6d28d9"
        tertiary: "#9333ea"
        highlight: "rgba(109, 40, 217, 0.10)"
        textHighlight: "rgba(147, 51, 234, 0.20)"
      darkMode:
        light: "#0f0b18"
        lightgray: "#1e162f"
        gray: "#7c6d99"
        darkgray: "#e9e1f7"
        dark: "#ffffff"
        secondary: "#c084fc"
        tertiary: "#e9d5ff"
        highlight: "rgba(192, 132, 252, 0.15)"
        textHighlight: "rgba(216, 180, 254, 0.25)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - git
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
      katexOptions:
        strict: false
        trust: true
      customMacros:
        "\\bar": "\\overline{#1}"
    order: 70
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: ./local-plugins/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 95
    layout:
      position: beforeBody
      priority: 5
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
    options:
      enableCaseRedirects: false
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderClickBehavior: "link"
      filterFn: |
        (node) => {
          const name = node.slugSegment;
          if (name === "tags") return false;
          if (name === "resource" || name === "recursos") return false;
          if (!node.isFolder) {
            const segs = String(node.slug ?? "").split("/").filter(Boolean);
            const norm = (x) => decodeURIComponent(x).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
            if (segs.length >= 2) {
              const last = norm(segs[segs.length - 1]);
              const parent = norm(segs[segs.length - 2]);
              if (last === parent) return false;
              if (last === "index") return false;
              if (last === `meu-${parent}` || last === `${parent}-hub` || last === `hub-${parent}`) return false;
              if (last === `midia-${parent}` || last === `midia${parent}`) return false;
              if (parent === "setup" && (last === "meu-setup" || last === "setup")) return false;
              if (parent === "media" && (last === "midia" || last === "midia-hub" || last === "index")) return false;
              if (parent === "about-me" && (last === "sobre-mim" || last === "about-me" || last === "sobre-mim-hub" || last === "index")) return false;
              if (parent === "projects" && (last === "projetos" || last === "projetos-publicos" || last === "site-publico-hub" || last === "index")) return false;
              if (parent === "academic" && (last === "academico" || last === "engenharia-de-computacao" || last === "index")) return false;
              if (parent === "research" && (last === "pesquisas" || last === "research" || last === "index")) return false;
            }
          }
          const path = window.location.pathname;
          const languages = ["en", "pt-br", "es", "fr"];
          const currentLang = languages.find((l) => path.includes(`/${l}/`)) ?? "pt-br";
          if (languages.includes(name) && name !== currentLang) return false;
          return true;
        }
      sortFn: |
        (a, b) => {
          const orderMap = {
            "about-me": 1,
            "sobre-mim": 1,
            "media": 2,
            "midia": 2,
            "research": 3,
            "pesquisas": 3,
            "projects": 4,
            "projetos": 4,
            "academic": 5,
            "academico": 5
          };
          const segA = (a.slugSegment || "").toLowerCase();
          const segB = (b.slugSegment || "").toLowerCase();
          const posA = orderMap[segA];
          const posB = orderMap[segB];
          if (posA !== undefined && posB !== undefined) return posA - posB;
          if (posA !== undefined) return -1;
          if (posB !== undefined) return 1;
          let orderA = a.data?.frontmatter?.order ?? 100;
          let orderB = b.data?.frontmatter?.order ?? 100;
          if (orderA !== orderB) return orderA - orderB;
          return a.displayName.localeCompare(b.displayName, undefined, { numeric: true, sensitivity: "base" });
        }
      mapFn: |
        (node) => {
          const seg = (node.slugSegment || "").toLowerCase();
          const path = (typeof window !== "undefined" && window.location) ? window.location.pathname : "";
          const isEn = path.includes("/en/");
          const isEs = path.includes("/es/");
          const isFr = path.includes("/fr/");

          const titleMap = {
            "about-me": isEn ? "About Me" : isEs ? "Sobre Mí" : isFr ? "À propos de moi" : "Sobre Mim",
            "sobre-mim": isEn ? "About Me" : isEs ? "Sobre Mí" : isFr ? "À propos de moi" : "Sobre Mim",
            "media": isEn ? "Media" : isEs ? "Medios" : isFr ? "Médias" : "Mídias",
            "midia": isEn ? "Media" : isEs ? "Medios" : isFr ? "Médias" : "Mídias",
            "research": isEn ? "Research" : isEs ? "Investigaciones" : isFr ? "Recherches" : "Pesquisas",
            "pesquisas": isEn ? "Research" : isEs ? "Investigaciones" : isFr ? "Recherches" : "Pesquisas",
            "projects": isEn ? "Projects" : isEs ? "Proyectos" : isFr ? "Projets" : "Projetos",
            "projetos": isEn ? "Projects" : isEs ? "Proyectos" : isFr ? "Projets" : "Projetos",
            "academic": isEn ? "Academic" : isEs ? "Académico" : isFr ? "Académique" : "Acadêmico",
            "academico": isEn ? "Academic" : isEs ? "Académico" : isFr ? "Académique" : "Acadêmico",
