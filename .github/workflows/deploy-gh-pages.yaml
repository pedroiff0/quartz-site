name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz Plugins
        run: npx quartz plugin install
      - name: Build Quartz
        env:
          PASSWORD_ENGENHARIA: ${{ secrets.PASSWORD_ENGENHARIA || 'eng232' }}
          PASSWORD_LATEX: ${{ secrets.PASSWORD_LATEX || 'escritaiff2026' }}
          PASSWORD_CURSO_ON: ${{ secrets.PASSWORD_CURSO_ON || '409182ph' }}
          PASSWORD_DEFAULT: ${{ secrets.PASSWORD_DEFAULT || 'eng232' }}
          QUARTZ_ENCRYPT_PASSWORD: ${{ secrets.QUARTZ_ENCRYPT_PASSWORD || 'eng232' }}
        run: npx quartz build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
